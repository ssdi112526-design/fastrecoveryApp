name: fastrecovery
description: "FastRecovery - app for authorized vehicle recovery agents."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  http: ^1.6.0
  get: ^4.7.3
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  printing: ^5.15.0
  url_launcher: ^6.3.2
  http_parser: ^4.1.2
  shimmer: ^3.0.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  geolocator: ^14.1.1
  package_info_plus: ^10.2.2
  init: ^1.0.0
  intl: ^0.20.3
  sqflite: ^2.4.4+2
  path: ^1.9.1
  connectivity_plus: ^7.3.1
  file_picker: ^13.1.0
  file_saver: ^0.6.0
  open_filex: ^4.5.0
  excel_plus: ^2.27.1
  pdf: ^3.13.1
  video_player: ^2.14.1
  razorpay_flutter: ^1.4.0


#  firebase_core: ^4.15.0
#  firebase_messaging: ^16.7.0
#  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/fastrecoverylogo.png"
  adaptive_icon_background: "#f2f3f4"
  adaptive_icon_foreground: "assets/images/fastrecoverylogo.png"


  fonts:
    - family: Schyler
      fonts:
        - asset: fonts/Schyler-Regular.ttf
        - asset: fonts/Schyler-Italic.ttf
          style: italic
    - family: Trajan Pro
      fonts:
        - asset: fonts/TrajanPro.ttf
        - asset: fonts/TrajanPro_Bold.ttf
          weight: 700
